<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Vertraulich</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-bg:    #0a0f0a;
    --dark-card:  #111a11;
    --green-dark: #3B6D11;
    --green-mid:  #639922;
    --green-neon: #7fff3a;
    --orange:     #EF9F27;
    --orange-dark:#633806;
    --red:        #cc2222;
    --cream:      #FFF8E7;
    --white:      #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--dark-bg);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--white);
  }

  /* Scanlines overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.13) 0px,
      rgba(0,0,0,.13) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Subtle green glow bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(99,153,34,.18) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(99,153,34,.10) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* Blinking static dots */
  .static-dot {
    position: fixed;
    border-radius: 50%;
    background: var(--green-neon);
    pointer-events: none;
    z-index: 1;
    animation: staticBlink linear infinite;
    opacity: 0;
  }
  @keyframes staticBlink {
    0%,100%{opacity:0} 50%{opacity:.55}
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    gap: 1.2rem;
  }

  /* ── TOP STAMP ── */
  .stamp {
    border: 3px solid var(--red);
    border-radius: .5rem;
    padding: .3rem 1.1rem;
    font-family: 'Fredoka One', cursive;
    font-size: .85rem;
    letter-spacing: .18em;
    color: var(--red);
    text-transform: uppercase;
    opacity: .9;
    transform: rotate(-2deg);
    box-shadow: 0 0 12px rgba(204,34,34,.35);
    animation: stampPulse 2s ease-in-out infinite;
  }
  @keyframes stampPulse {
    0%,100%{box-shadow:0 0 12px rgba(204,34,34,.35)}
    50%{box-shadow:0 0 28px rgba(204,34,34,.7)}
  }

  .secret-label {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    letter-spacing: .16em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: .3rem;
    text-shadow: 0 0 10px rgba(204,34,34,.5);
  }

  .frog-imagebox {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    max-height: 260px;
    margin: 0 auto 1rem;
    background: #000;
    border: 2px solid var(--green-mid);
    border-radius: 1.2rem;
    box-shadow: 0 0 20px rgba(99,153,34,.3);
    overflow: hidden;
  }
  .frog-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 1rem;
    transition: opacity 2.2s ease;
  }
  .frog-birthday { opacity: 1; }
  .frog-detective { opacity: 0; }
  .frog-imagebox.revealed .frog-birthday { opacity: 0; }
  .frog-imagebox.revealed .frog-detective { opacity: 1; }

  /* ── CARD ── */
  .card {
    background: rgba(17,26,17,0.92);
    border: 2px solid var(--green-mid);
    border-radius: 2rem;
    padding: 1.4rem 1rem 1.2rem;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 0 32px rgba(99,153,34,.25), 6px 6px 0 var(--green-dark);
    animation: popIn .6s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.88) translateY(24px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── HEADER ── */
  .card-header {
    display: flex;
    align-items: center;
    gap: .7rem;
    margin-bottom: 1rem;
    padding-bottom: .8rem;
    border-bottom: 1px solid rgba(99,153,34,.3);
  }
  .header-text {
    display: flex;
    align-items: center;
  }
  .frog-badge {
    font-size: 2.4rem;
    animation: frogBob .8s ease-in-out infinite alternate;
    flex-shrink: 0;
  }
  .kroticole-img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid var(--green-mid);
    box-shadow: 3px 3px 0 var(--green-dark);
    background: var(--dark-card);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
  }
  .kroticole-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  @keyframes frogBob {
    from{transform:translateY(0)} to{transform:translateY(-5px)}
  }
  .header-text { text-align: left; }
  .header-from {
    font-size: .82rem;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--green-neon);
    opacity: .85;
    line-height: 1.4;
  }
  .header-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.15rem;
    color: var(--white);
    line-height: 1.2;
  }

  /* ── MESSAGE ── */
  .message-box {
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(99,153,34,.25);
    border-radius: 1rem;
    padding: .9rem 1rem;
    font-size: .88rem;
    font-weight: 700;
    color: rgba(255,255,255,.85);
    line-height: 1.65;
    margin-bottom: 1rem;
    position: relative;
    min-height: 320px;
    height: 320px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .message-box::before {
    content: '▶';
    position: absolute;
    top: .75rem;
    left: -.9rem;
    color: var(--green-mid);
    font-size: .7rem;
  }
  .msg-highlight {
    color: var(--green-neon);
    font-weight: 800;
  }
  .decrypt-btn {
    width: 100%;
    padding: .65rem 1rem;
    border-radius: 1.5rem;
    border: 2px solid var(--green-mid);
    background: rgba(99,153,34,.15);
    color: var(--green-neon);
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 1rem;
    box-shadow: 0 0 12px rgba(99,153,34,.25);
    transition: background .2s, box-shadow .2s;
    letter-spacing: .04em;
  }
  .decrypt-btn:active { background: rgba(99,153,34,.3); }
  .decrypt-btn:disabled { opacity: .4; cursor: default; }
  .decrypt-text {
    font-family: 'Nunito', monospace;
    font-size: .88rem;
    font-weight: 700;
    color: rgba(255,255,255,.85);
    line-height: 1.65;
    white-space: pre-wrap;
    letter-spacing: .02em;
    width: 100%;
  }

  /* ── WATCH BUTTON (appears after decrypt, opens video fullscreen) ── */
  .watch-btn {
    display: none;
    width: 100%;
    padding: .85rem 1.8rem;
    border-radius: 2rem;
    border: 3px solid var(--orange-dark);
    font-family: 'Fredoka One', cursive;
    font-size: 1.15rem;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--orange-dark);
    transition: transform .12s, box-shadow .12s;
    background: var(--orange);
    color: var(--white);
    text-align: center;
    animation: btnPop .5s cubic-bezier(.175,.885,.32,1.275);
  }
  .watch-btn.visible { display: block; }
  .watch-btn:active {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 var(--orange-dark);
  }
  @keyframes btnPop {
    from{opacity:0;transform:scale(.8) translateY(10px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }

  /* ── FULLSCREEN VIDEO OVERLAY ── */
  .video-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .video-overlay.active { display: flex; }
  .video-overlay iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .video-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.5);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    z-index: 301;
  }
</style>
</head>
<body>

<!-- static noise dots -->

<div class="page">

  <div class="stamp">⚠️ Streng geheim — nur für Romi</div>

  <div class="card">

    <div class="secret-label">STRENG GEHEIM</div>
    <div class="card-header">
      <div class="header-text">
        <div class="header-from">🔐 Verschlüsselte Nachricht von <span id="quak-name">Froschinspektor Quak</span></div>
      </div>
    </div>

    <!-- Image box: birthday frog -> detective frog crossfade -->
    <div class="frog-imagebox" id="frog-imagebox">
      <svg class="frog-svg frog-birthday" id="frog-birthday" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
        <!-- cattails/reeds background hint -->
        <ellipse cx="100" cy="205" rx="90" ry="14" fill="#1a3a0a" opacity=".5"/>
        <!-- party hat BEHIND head/eyes -->
        <path d="M100 8 L128 66 L72 66 Z" fill="#c77dff" stroke="#7a3fa0" stroke-width="2"/>
        <path d="M100 8 L112 66 L88 66 Z" fill="#e0a8ff" opacity=".6"/>
        <circle cx="100" cy="8" r="7" fill="#ffd166" stroke="#c99a2e" stroke-width="1.5"/>
        <!-- body (small, mostly cropped) -->
        <ellipse cx="100" cy="168" rx="46" ry="34" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <!-- head -->
        <ellipse cx="100" cy="100" rx="58" ry="52" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="78" cy="78" rx="20" ry="13" fill="#5ab830" opacity=".3"/>
        <!-- eye bumps (drawn AFTER hat so they sit in front) -->
        <ellipse cx="66" cy="62" rx="24" ry="22" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="134" cy="62" rx="24" ry="22" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="66" cy="61" rx="15.5" ry="14.5" fill="#fff"/>
        <ellipse cx="134" cy="61" rx="15.5" ry="14.5" fill="#fff"/>
        <circle cx="68" cy="63" r="8.5" fill="#5a3a18"/>
        <circle cx="136" cy="63" r="8.5" fill="#5a3a18"/>
        <circle cx="64" cy="58" r="3" fill="#fff"/>
        <circle cx="132" cy="58" r="3" fill="#fff"/>
        <!-- smile -->
        <path d="M74 118 Q100 134 126 118" fill="none" stroke="#1a5008" stroke-width="3" stroke-linecap="round"/>
        <!-- cheeks -->
        <circle cx="56" cy="104" r="7.5" fill="#EF9F27" opacity=".35"/>
        <circle cx="144" cy="104" r="7.5" fill="#EF9F27" opacity=".35"/>
      </svg>

      <svg class="frog-svg frog-detective" id="frog-detective" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="205" rx="90" ry="14" fill="#1a3a0a" opacity=".5"/>
        <!-- trench coat body -->
        <path d="M62 158 Q60 198 66 202 L134 202 Q140 198 138 158 Z" fill="#8a7458" stroke="#5c4a34" stroke-width="2.5"/>
        <path d="M100 158 L100 202" stroke="#5c4a34" stroke-width="1.5"/>
        <circle cx="92" cy="172" r="2.5" fill="#5c4a34"/>
        <circle cx="92" cy="184" r="2.5" fill="#5c4a34"/>
        <path d="M62 158 Q50 172 48 190" fill="none" stroke="#5c4a34" stroke-width="2"/>
        <path d="M138 158 Q150 172 152 190" fill="none" stroke="#5c4a34" stroke-width="2"/>
        <!-- coat collar -->
        <path d="M78 156 L100 174 L122 156 L118 150 L100 162 L82 150 Z" fill="#6e5a40" stroke="#5c4a34" stroke-width="1.5"/>
        <!-- arms -->
        <ellipse cx="52" cy="158" rx="13" ry="17" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2"/>
        <ellipse cx="148" cy="158" rx="13" ry="17" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2"/>
        <!-- magnifying glass, mirrored: handle near hand, lens held outward -->
        <line x1="147" y1="150" x2="164" y2="126" stroke="#5c3a1a" stroke-width="5" stroke-linecap="round"/>
        <circle cx="171" cy="114" r="14" fill="rgba(200,230,255,.4)" stroke="#3a2a1a" stroke-width="3.5"/>
        <circle cx="167" cy="109" r="4" fill="#fff" opacity=".6"/>
        <!-- classic detective fedora, BEHIND head/eyes -->
        <!-- brim (wide flat oval) -->
        <ellipse cx="100" cy="52" rx="64" ry="11" fill="#4a3520" stroke="#4a2f14" stroke-width="2.5"/>
        <ellipse cx="100" cy="50" rx="58" ry="8" fill="#5c4228" stroke="#4a2f14" stroke-width="1.5"/>
        <!-- crown (rounded block sitting on brim) -->
        <path d="M72 44 Q70 6 100 2 Q130 6 128 44 L124 44 Q126 12 100 8 Q74 12 76 44 Z"
              fill="#5c4228" stroke="#4a2f14" stroke-width="2.5"/>
        <path d="M76 44 L124 44 L128 44 Q130 48 128 52 L72 52 Q70 48 72 44 Z"
              fill="#4a3520" stroke="#4a2f14" stroke-width="2.5"/>
        <!-- pinch dent on top -->
        <path d="M92 6 Q100 12 108 6" fill="none" stroke="#4a2f14" stroke-width="1.8" opacity=".6"/>
        <!-- hat band -->
        <rect x="70" y="35" width="60" height="11" rx="2" fill="#8b1a1a" stroke="#5c0f0f" stroke-width="1.5"/>
        <!-- head -->
        <ellipse cx="100" cy="100" rx="58" ry="52" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="78" cy="78" rx="20" ry="13" fill="#5ab830" opacity=".3"/>
        <!-- eye bumps (drawn AFTER hat so eyes stay visible) -->
        <ellipse cx="66" cy="62" rx="24" ry="22" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="134" cy="62" rx="24" ry="22" fill="#4a9e2a" stroke="#2d6a10" stroke-width="2.5"/>
        <ellipse cx="66" cy="61" rx="15.5" ry="14.5" fill="#fff"/>
        <ellipse cx="134" cy="61" rx="15.5" ry="14.5" fill="#fff"/>
        <circle cx="68" cy="63" r="8.5" fill="#5a3a18"/>
        <circle cx="136" cy="63" r="8.5" fill="#5a3a18"/>
        <circle cx="64" cy="58" r="3" fill="#fff"/>
        <circle cx="132" cy="58" r="3" fill="#fff"/>
        <!-- serious brows -->
        <path d="M48 46 Q66 38 84 44" fill="none" stroke="#1a5008" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M116 44 Q134 38 152 46" fill="none" stroke="#1a5008" stroke-width="3.5" stroke-linecap="round"/>
        <!-- determined mouth -->
        <path d="M76 118 Q100 128 124 118" fill="none" stroke="#1a5008" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="message-box" id="message-box">
      <span class="decrypt-text" id="decrypt-text"></span>
    </div>
    <button class="decrypt-btn" id="decrypt-btn" onclick="startDecrypt()">📨 Nachricht öffnen</button>

    <button class="watch-btn" id="watch-btn" onclick="startVideo()">
      ▶ Starten
    </button>

  </div>

</div>

<!-- Fullscreen video overlay -->
<div class="video-overlay" id="video-overlay">
  <button class="video-close" onclick="closeVideo()">✕</button>
  <iframe id="evidence-video"
    src=""
    data-src="https://www.youtube-nocookie.com/embed/WN0q47hZCW0?autoplay=1"
    title="Geheime Botschaft"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>
</div>

<script>
  // ── Static noise dots ─────────────────────────────────
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'static-dot';
    const sz = 1 + Math.random() * 3;
    d.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      animation-duration:${0.08 + Math.random()*0.25}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(d);
  }

  // ── Show button after video ends ──────────────────────
  // Note: evidence-video is now a YouTube iframe; 'ended' event doesn't fire cross-origin.
  const watchBtn = document.getElementById('watch-btn');

  // ── Decrypt effect ───────────────────────────────────
  const finalText = [
    { text: "Romi, es wird Zeit, dass du die Wahrheit erfährst.\n\n", highlight: false },
    { text: "Ich bin kein gewöhnlicher Geburtstagsfrosch. Mein Name ist Froschinspektor Quak — seit Jahren bin ich Kröticole, der gefürchteten Geschenkefresserin, auf der Spur. Doch sie blieb mir immer einen Sprung voraus.\n\n", highlight: false },
    { text: "Heute jedoch konnte meine Crew und ich alles beobachten. Schau dir das an, Romi.\n\n", highlight: false },
    { text: "Nur du kannst sie jetzt noch aufhalten, bevor sie dein Geschenk verschlingt!", highlight: true }
  ];

  const fullPlain = finalText.map(s => s.text).join('');
  const glitchChars = '!@#$%^&*<>?/|{}[]~±§€₿Ω∆∑π√∞≠≈ψξΘΛΞΠΣΦΨ';
  const decryptEl = document.getElementById('decrypt-text');
  const decryptBtn = document.getElementById('decrypt-btn');

  const quakNameEl = document.getElementById('quak-name');
  const quakNamePlain = 'Froschinspektor Quak';

  // Show static scrambled text on load
  function scramble(text) {
    return text.split('').map(c => {
      if (c === ' ' || c === '\n') return c;
      return glitchChars[Math.floor(Math.random() * glitchChars.length)];
    }).join('');
  }
  decryptEl.textContent = scramble(fullPlain);
  quakNameEl.textContent = scramble(quakNamePlain);

  let scrambleInterval = null; // no auto-refresh

  let decryptStarted = false;

  function startVideo() {
    const overlay = document.getElementById('video-overlay');
    const iframe  = document.getElementById('evidence-video');
    iframe.src = iframe.getAttribute('data-src');
    overlay.classList.add('active');
  }

  function closeVideo() {
    const overlay = document.getElementById('video-overlay');
    const iframe  = document.getElementById('evidence-video');
    overlay.classList.remove('active');
    iframe.src = '';
  }

  function startDecrypt() {
    if (decryptStarted) return;
    decryptStarted = true;
    clearInterval(scrambleInterval);
    decryptBtn.disabled = true;
    decryptBtn.textContent = '⏳ Entschlüsselung läuft…';

    // Crossfade the frog image: birthday frog -> detective frog
    document.getElementById('frog-imagebox').classList.add('revealed');

    // Decrypt the name quickly (over ~600ms)
    let nameRevealed = 0;
    const nameInterval = setInterval(() => {
      nameRevealed += 2;
      if (nameRevealed >= quakNamePlain.length) {
        quakNameEl.textContent = quakNamePlain;
        clearInterval(nameInterval);
      } else {
        quakNameEl.textContent = quakNamePlain.slice(0, nameRevealed) + scramble(quakNamePlain.slice(nameRevealed));
      }
    }, 40);

    let revealed = 0;
    const totalChars = fullPlain.length;

    function buildHTML(revealedCount) {
      let html = '';
      let charIdx = 0;
      for (const seg of finalText) {
        const segEnd = charIdx + seg.text.length;
        const revCount = Math.max(0, Math.min(revealedCount, segEnd) - charIdx);
        const revealedPart = seg.text.slice(0, revCount);
        const hiddenPart = revCount < seg.text.length
          ? scramble(seg.text.slice(revCount)).replace(/\n/g, '')
          : '';
        const fullPart = revealedPart.replace(/\n/g, '<br>') + hiddenPart;
        html += seg.highlight
          ? `<span class="msg-highlight">${fullPart}</span>`
          : fullPart;
        charIdx = segEnd;
      }
      return html;
    }

    const interval = setInterval(() => {
      revealed += 3;
      if (revealed >= totalChars) {
        revealed = totalChars;
        let html = '';
        for (const seg of finalText) {
          const t = seg.text.replace(/\n/g, '<br>');
          html += seg.highlight ? `<span class="msg-highlight">${t}</span>` : t;
        }
        decryptEl.innerHTML = html;
        decryptBtn.style.display = 'none';
        clearInterval(interval);

        // Show the "Starten" button
        watchBtn.classList.add('visible');
        watchBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        decryptEl.innerHTML = buildHTML(revealed);
      }
    }, 40);
  }


</script>
</body>
</html>
