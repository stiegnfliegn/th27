<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Vertraulich</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-bg:    #0a0f0a;
    --dark-card:  #111a11;
    --green-dark: #3B6D11;
    --green-mid:  #639922;
    --green-neon: #7fff3a;
    --orange:     #EF9F27;
    --orange-dark:#633806;
    --red:        #cc2222;
    --white:      #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: var(--dark-bg);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--white);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.13) 0px,
      rgba(0,0,0,.13) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(99,153,34,.18) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(99,153,34,.10) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  .static-dot {
    position: fixed;
    border-radius: 50%;
    background: var(--green-neon);
    pointer-events: none;
    z-index: 1;
    animation: staticBlink linear infinite;
    opacity: 0;
  }
  @keyframes staticBlink {
    0%,100%{opacity:0} 50%{opacity:.55}
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    gap: 2rem;
    text-align: center;
  }

  .stamp {
    border: 3px solid var(--red);
    border-radius: .5rem;
    padding: .5rem 1.4rem;
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    letter-spacing: .16em;
    color: var(--red);
    text-transform: uppercase;
    opacity: .95;
    transform: rotate(-2deg);
    box-shadow: 0 0 16px rgba(204,34,34,.4);
    animation: stampPulse 2s ease-in-out infinite;
  }
  @keyframes stampPulse {
    0%,100%{box-shadow:0 0 16px rgba(204,34,34,.4)}
    50%{box-shadow:0 0 34px rgba(204,34,34,.75)}
  }

  .stamp-sub {
    display: block;
    font-size: .68rem;
    letter-spacing: .1em;
    margin-top: .3rem;
    color: rgba(255,255,255,.7);
    text-transform: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
  }

  .frog-icon {
    font-size: 3rem;
    animation: frogBob .8s ease-in-out infinite alternate;
  }
  @keyframes frogBob {
    from{transform:translateY(0)} to{transform:translateY(-6px)}
  }

  .open-btn {
    width: 100%;
    max-width: 320px;
    padding: 1rem 1.8rem;
    border-radius: 2rem;
    border: 3px solid var(--green-mid);
    font-family: 'Fredoka One', cursive;
    font-size: 1.15rem;
    cursor: pointer;
    background: rgba(99,153,34,.15);
    color: var(--green-neon);
    box-shadow: 0 0 20px rgba(99,153,34,.3);
    transition: transform .12s, background .2s;
    text-decoration: none;
    display: inline-block;
    letter-spacing: .03em;
  }
  .open-btn:active {
    transform: translateY(2px);
    background: rgba(99,153,34,.3);
  }
</style>
</head>
<body>

<div class="page">

  <div class="frog-icon">🐸</div>

  <div class="stamp">
    ⚠️ Streng geheim — nur für Romi
    <span class="stamp-sub">EINGEHENDE VERSCHLÜSSELTE ÜBERTRAGUNG</span>
  </div>

  <a class="open-btn" href="ratsel5_6543_main.html?play=1">📨 Nachricht öffnen</a>

</div>

<script>
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'static-dot';
    const sz = 1 + Math.random() * 3;
    d.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      animation-duration:${0.08 + Math.random()*0.25}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(d);
  }
</script>
</body>
</html>
